<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Times PDF Uploader</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
    input, button { padding: 10px; margin: 10px 0; }
    button { background: #007AFF; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Prayer Times Uploader</h1>
  <input type="file" id="pdfFile" accept=".pdf">
  <button onclick="uploadPDF()">Parse & Update</button>
  <p id="status"></p>
  
  <script>
    async function uploadPDF() {
      const file = document.getElementById('pdfFile').files[0];
      if (!file) { alert('Select a PDF'); return; }
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        document.getElementById('status').textContent = 'Processing...';
        
        try {
          const response = await fetch('/api/parsePDF', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pdfBase64: base64 })
          });
          const data = await response.json();
          document.getElementById('status').textContent = data.message || 'Done!';
        } catch (err) {
          document.getElementById('status').textContent = 'Error: ' + err.message;
        }
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
